# ==============================================================================
# NGINX CONFIGURATION FOR SIPU MANAGEMENT (sipumanagement.my.id)
# High Performance, HTTP/2, Gzip Compression & Static Asset Caching
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sipumanagement.my.id www.sipumanagement.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sipumanagement.my.id www.sipumanagement.my.id;

    root /var/www/sipumanagement/public;
    index index.php index.html;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/sipumanagement.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sipumanagement.my.id/privkey.pem;

    # SSL Security Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    charset utf-8;
    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # GZIP COMPRESSION CONFIGURATION
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # IMMUTABLE CACHE FOR VITE COMPILED ASSETS (Hashed Filenames)
    # --------------------------------------------------------------------------
    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static Media & Icons (Non-hashed)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(?:\.env|\.git|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml) {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # LARAVEL ROUTING & FASTCGI PHP-FPM
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Sesuaikan dengan socket PHP VPS
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # FastCGI Buffer Tuning for Inertia Payloads & JSON
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
    }
}
