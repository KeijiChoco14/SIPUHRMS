; ==============================================================================
; RECOMMENDED PHP-FPM & OPCACHE SETTINGS FOR SIPU MANAGEMENT
; Tailored for 2GB - 4GB RAM VPS environment
; ==============================================================================

[opcache]
; Enable Zend OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Memory Allocation
; Allocate 128MB to 256MB RAM for OPcache bytecode
opcache.memory_consumption = 192

; Max Interned Strings Buffer (Stores repeated strings like class names)
opcache.interned_strings_buffer = 16

; Max Cached Scripts (Keep higher than total PHP files in repo ~10,000)
opcache.max_accelerated_files = 16229

; Revalidate Frequency
; In production: 0 = always check timestamps or set to 60 for 60s cache recheck
; For maximum speed with deployment pipeline (artisan optimize):
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Fast Shutdown
opcache.fast_shutdown = 1
opcache.save_comments = 1

; ------------------------------------------------------------------------------
; PHP-FPM POOL CONFIGURATION (e.g., /etc/php/8.3/fpm/pool.d/www.conf)
; ------------------------------------------------------------------------------
; [www]
; pm = dynamic
;
; Memory per PHP worker in Laravel typically averages 30MB - 50MB.
; On a 2GB VPS (reserving 700MB for OS + Nginx + SQLite):
; Available for PHP-FPM: ~1200MB -> max 25-30 workers.
;
; pm.max_children = 25
; pm.start_servers = 5
; pm.min_spare_servers = 5
; pm.max_spare_servers = 10
; pm.max_requests = 1000  ; Prevents memory leaks by recycling worker after 1000 requests
; request_terminate_timeout = 60s
